<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload Bank Statements — Spendwise</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body data-page="upload">
  <nav class="nav">
    <div class="container nav-inner">
      <div class="brand"><span class="brand-icon">⏱️</span><a href="index.html">Spendwise</a></div>
      <div style="display:flex;gap:10px">
        <a class="btn ghost" href="dashboard.html">Dashboard</a>
      </div>
    </div>
  </nav>

  <main class="container section">
    <h1>Upload Bank Statements</h1>
    <p class="muted">Drag and drop your PDF or CSV files to get started</p>

    <div class="card">
      <div class="dropzone" id="dropzone">
        <div>
          <div style="font-size:36px;opacity:.6">📤</div>
          <div style="font-weight:700;margin-top:8px">Drag and drop your statements here</div>
          <div class="muted">or click to browse files</div>
          <div style="margin-top:16px"><button class="btn" type="button">Select Files</button></div>
        </div>
      </div>
      <input id="fileInput" type="file" accept=".pdf,.csv" multiple hidden />

      <div class="file-list" id="fileList"></div>

      <div class="stepper">
        <div class="step"><div class="dot"></div><label>Detecting</label></div>
        <div class="step"><div class="dot"></div><label>Parsing</label></div>
        <div class="step"><div class="dot"></div><label>Categorizing</label></div>
        <div class="step"><div class="dot"></div><label>Merging</label></div>
      </div>

      <div style="display:flex;justify-content:flex-end;margin-top:16px">
        <button class="btn" id="analyzeBtn" disabled>Analyze Statements</button>
      </div>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script>
    // Wire dropzone root click to hidden input
    document.querySelector('.dropzone').addEventListener('click', ()=> document.getElementById('fileInput').click());
  </script>
</body>
</html>
