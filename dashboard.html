<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spendwise Dashboard</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body data-page="dashboard">
  <nav class="nav">
    <div class="container nav-inner">
      <div class="brand"><span class="brand-icon">⏱️</span><a href="index.html">Spendwise</a></div>
      <div style="display:flex;gap:10px">
        <a class="btn" href="upload.html">Upload More</a>
      </div>
    </div>
  </nav>

  <main class="container section">
    <h1>Your Spending Dashboard</h1>
    <p class="muted">Track your expenses across all accounts</p>

    <div class="toolbar">
      <select class="select" id="filterMonth">
        <option value="all">All Months</option>
        <option value="0">January</option>
        <option value="1">February</option>
        <option value="2">March</option>
        <option value="3">April</option>
        <option value="4">May</option>
        <option value="5">June</option>
        <option value="6">July</option>
        <option value="7">August</option>
        <option value="8">September</option>
        <option value="9">October</option>
        <option value="10">November</option>
        <option value="11">December</option>
      </select>
      <select class="select" id="filterBank"><option>All Banks</option></select>
      <select class="select" id="filterCategory"><option>All Categories</option></select>
    </div>

    <div class="stats">
      <div class="stat">
        <div style="font-weight:700">Total Spends</div>
        <div class="value" id="statTotal">₹0</div>
        <div class="muted">↗ vs last month</div>
      </div>
      <div class="stat">
        <div style="font-weight:700">Biggest Category</div>
        <div class="value" id="statBiggestCat">N/A</div>
        <div class="muted">No data</div>
      </div>
      <div class="stat">
        <div style="font-weight:700">Top Bank</div>
        <div class="value" id="statTopBank">N/A</div>
        <div class="muted">No data</div>
      </div>
      <div class="stat">
        <div style="font-weight:700">vs Last Month</div>
        <div class="value" id="statChange">0%</div>
        <div class="muted">Savings increased</div>
      </div>
    </div>

    <div id="charts" class="charts">
      <!-- filled by app.js -->
    </div>

    <section class="section">
      <h2>Transactions</h2>
      <div class="card">
        <table class="table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Bank</th>
              <th>Description</th>
              <th>Amount</th>
              <th>Category</th>
            </tr>
          </thead>
          <tbody id="txBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
